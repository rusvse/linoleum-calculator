<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Линум — расчёт линолеума</title><link rel="stylesheet" href="style.css"></head><body><header><div><b>Линум</b><span>Расчёт линолеума для квартир</span></div><button id="printBtn" class="secondary">Печать</button></header><main><section class="card"><h1>Проект и параметры</h1><div class="grid settings"><label>Название проекта<input id="projectName" placeholder="Например, ЖК Троицкая"></label><label>Линолеум / артикул<input id="material" placeholder="Название или артикул"></label><label>Ширины рулонов, м<input id="rollWidths" value="2, 2.5, 3, 3.5, 4, 5"><small>Через запятую</small></label><label>Запас с каждой стороны, см<input id="allowance" type="number" min="0" step="1" value="10"></label><label>Режим подбора<select id="mode"><option value="seams">Минимум стыков</option><option value="waste">Минимум отходов</option></select></label><label>URL Google Apps Script<input id="appsScriptUrl" placeholder="Вставьте URL веб-приложения Apps Script"></label></div><div class="actions"><button id="saveProject">Сохранить параметры</button><button id="calculate" class="primary">Рассчитать</button></div></section><section class="card"><div class="section-head"><h2>Квартиры и помещения</h2><button id="addApartment">+ Добавить квартиру</button></div><div id="apartments"></div></section><section class="card"><div class="section-head"><h2>Результаты расчёта</h2><div class="filters"><select id="filterApartment"><option value="">Все квартиры</option></select><select id="filterRoom"><option value="">Все помещения</option></select><select id="filterWidth"><option value="">Все ширины</option></select></div></div><div class="table-wrap"><table><thead><tr><th>Маркировка</th><th>Квартира</th><th>Помещение</th><th>Размер</th><th>С запасом</th><th>Рулон</th><th>Полос</th><th>Метраж</th><th>Площадь</th><th>Остаток</th><th>Стыков</th><th>Комментарий</th></tr></thead><tbody id="results"></tbody></table></div></section><section class="card"><div class="section-head"><h2>Сводка для заказа</h2><div class="actions"><button id="downloadCsv" class="secondary">Скачать CSV</button><button id="exportSheets" class="primary">Выгрузить в Google Таблицы</button></div></div><div class="table-wrap"><table><thead><tr><th>Ширина рулона</th><th>Погонный метраж</th><th>Площадь</th><th>Помещений</th><th>Маркировки</th></tr></thead><tbody id="summary"></tbody></table></div><p id="message" class="message"></p></section></main><template id="apartmentTpl"><article class="apartment"><div class="section-head"><div class="apt-fields"><label>№ квартиры<input class="apt-number" placeholder="01"></label><label>Название<input class="apt-name" placeholder="КВ01"></label><label>Комментарий<input class="apt-comment" placeholder="Необязательно"></label></div><div class="actions"><button class="copy-apt secondary">Копировать</button><button class="delete-apt danger">Удалить</button></div></div><div class="rooms"></div><button class="add-room secondary">+ Добавить помещение</button></article></template><template id="roomTpl"><div class="room"><select class="room-type"></select><input class="room-custom" placeholder="Своё название" hidden><input class="room-code" placeholder="Код" hidden><label>Длина, м<input class="room-length" inputmode="decimal" placeholder="4,20"></label><label>Ширина, м<input class="room-width" inputmode="decimal" placeholder="3,35"></label><input class="room-comment" placeholder="Комментарий"><button class="copy-room secondary">Копировать</button><button class="delete-room danger">×</button></div></template><script src="app.js"></script></body></html>
